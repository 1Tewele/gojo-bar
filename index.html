<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gojo Bar">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16222D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Gojo Bar</title>
<style>
:root{
  --bg:#EEF5FA; --surface:#FFFFFF; --ink:#15212C; --muted:#5B6B7B; --line:#D6E2EB;
  --tint:#CCECFF; --accent:#1C64A8; --accent-ink:#FFFFFF; --honey:#E3A21A; --honey-soft:#FCEFD0;
  --ok:#23794B; --ok-soft:#DDF2E6; --warn:#9A6A00; --warn-soft:#FFF0C7; --bad:#B53A31; --bad-soft:#FBE0DD;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1821; --surface:#16222D; --ink:#E4EDF4; --muted:#93A4B4; --line:#283846;
    --tint:#1D3A52; --accent:#5AA8E8; --accent-ink:#0E1821; --honey:#F0B53B; --honey-soft:#3A2E12;
    --ok:#5CC48A; --ok-soft:#173326; --warn:#E8B64A; --warn-soft:#3A2F12; --bad:#F0827A; --bad-soft:#3D1D1B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1821; --surface:#16222D; --ink:#E4EDF4; --muted:#93A4B4; --line:#283846;
  --tint:#1D3A52; --accent:#5AA8E8; --accent-ink:#0E1821; --honey:#F0B53B; --honey-soft:#3A2E12;
  --ok:#5CC48A; --ok-soft:#173326; --warn:#E8B64A; --warn-soft:#3A2F12; --bad:#F0827A; --bad-soft:#3D1D1B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Calibri Light",Calibri,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
header.top h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.2px}
header.top .right{display:flex;gap:10px;align-items:center}
#sync{font-size:13px;color:var(--muted)}
.iconbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:14px}
main{max-width:640px;margin:0 auto;padding:14px 14px 110px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:12px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a.on{color:var(--accent);font-weight:600}
h2{font-size:22px;font-weight:600;margin:6px 2px 10px}
h3{font-size:16px;font-weight:600;margin:18px 2px 8px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.name{font-size:16px}
.sub{font-size:13px;color:var(--muted)}
.num{font-weight:600;text-align:right;white-space:nowrap}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar input{flex:1}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--tint);color:var(--ink);font-size:20px;line-height:1;padding:0}
.step input{width:64px;text-align:center;padding:8px 4px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-size:17px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.secondary{background:var(--tint);color:var(--ink)}
.btn.small{display:inline-block;width:auto;padding:8px 12px;font-size:15px}
.btn:disabled{opacity:.5}
.savebar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));margin-top:12px}
.form{padding:12px;display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.honey{background:var(--honey-soft);color:var(--warn)}
.pill.plain{background:var(--tint);color:var(--ink)}
.banner{border-radius:12px;padding:12px;margin-bottom:12px;font-size:15px}
.banner.honey{background:var(--honey-soft);border:1px solid var(--honey)}
.banner.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.banner.info{background:var(--tint)}
.totals .row .num{font-size:17px}
.diff-neg{color:var(--bad)}
.diff-pos{color:var(--ok)}
/* keg gauge: the one bold element */
.kegwrap{display:flex;gap:16px;align-items:stretch;padding:16px}
.keg{position:relative;width:92px;height:150px;border:3px solid var(--ink);border-radius:18px 18px 22px 22px;overflow:hidden;flex:none;background:var(--surface)}
.keg::before,.keg::after{content:"";position:absolute;left:-3px;right:-3px;height:3px;background:var(--ink);z-index:2}
.keg::before{top:32%}.keg::after{top:68%}
.keg .fill{position:absolute;left:0;right:0;bottom:0;background:var(--honey);transition:height .6s ease}
.keg .fill::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px;background:repeating-radial-gradient(circle at 6px 8px,#FFF8E6 0 5px,transparent 5px 12px)}
.kegtext{display:flex;flex-direction:column;justify-content:center;gap:6px}
.big{font-size:44px;font-weight:600;line-height:1}
.mid{font-size:20px;font-weight:600}
.empty{padding:20px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
#toast.show{opacity:1}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.linkish{background:none;border:0;color:var(--accent);font:inherit;padding:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.login{max-width:420px;margin:40px auto;padding:0 16px}
.login .panel{padding:18px}
.login h2{margin-top:0}
.err{color:var(--bad);font-size:14px;min-height:18px}
.pending{color:var(--warn)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <h1 id="barname">Gojo Bar</h1>
  <div class="right"><span id="sync">Starting…</span><a class="iconbtn" href="#setup" id="setuplink" hidden>Prices</a></div>
</header>
<main id="view"><div class="empty">Loading…</div></main>
<nav class="tabs" aria-label="Main" id="tabs" hidden>
  <a href="#sales" data-tab="sales"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>Sales</a>
  <a href="#stock" data-tab="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6v4l2 3v11H7V10l2-3z"/></svg>Stock</a>
  <a href="#draft" data-tab="draft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M6 9h12M6 15h12"/></svg>Draft</a>
  <a href="#given" data-tab="given"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></svg>Given</a>
  <a href="#money" data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Money</a>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
